name: Aggiorna turni e pubblica

on:
  # Copia di riserva dei dati (il sito legge i turni dal lettore Cloudflare): ogni 3 ore circa.
  # Sito pubblicato su https://thecimix2000.github.io/SpaceTrackday/
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leggi i turni da Vallelunga
        id: fetch
        run: node scripts/update.mjs
      - name: Salva i dati se sono cambiati
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "trackday-vl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "Aggiorna turni"
          git pull --rebase -q && git push || echo "Salvataggio dei dati saltato (verrà ritentato al prossimo giro)"
      - name: Prepara il sito
        run: mkdir _site && cp index.html data.json favicon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        # Negli aggiornamenti automatici un intoppo temporaneo di GitHub non deve far fallire tutto: il sito resta quello di prima.
        continue-on-error: ${{ github.event_name == 'schedule' }}
